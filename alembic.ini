# Alembic configuration for Project Hares Sovereign Fraud Triage Engine

[alembic]
# Path to migration scripts
script_location = src/hares/db/migrations

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Sys.path prepends
prepend_sys_path = src

# Max length of characters for slug
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without .py
sourceless = false

# Version location
version_locations = %(here)s/src/hares/db/migrations/versions

# Database URL fallback; dynamically overridden by hares.core.config.get_settings() in env.py
sqlalchemy.url = postgresql+psycopg2://hares_admin:REPLACE_IN_ENV@localhost:5432/hares_threat_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
