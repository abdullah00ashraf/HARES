services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hares-api
    restart: always
    env_file: .env
    ports:
      - "8000:8000"
    networks:
      - hares_ingress
      - hares_internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hares-worker
    restart: always
    env_file: .env
    command: ["celery", "-A", "hares.workers.celery_app.celery_app", "worker", "--loglevel=info", "-Q", "high_priority_triage,media_triage", "-c", "4"]
    networks:
      - hares_internal
      - hares_egress
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: hares-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hares_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_postgres_password_here}
      POSTGRES_DB: ${POSTGRES_DB:-hares_threat_db}
    volumes:
      - hares_postgres_data:/var/lib/postgresql/data
    networks:
      - hares_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hares_admin} -d ${POSTGRES_DB:-hares_threat_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hares-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-secure_redis_password_here}"]
    volumes:
      - hares_redis_data:/data
    networks:
      - hares_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secure_redis_password_here}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  hares_ingress:
    driver: bridge
  hares_internal:
    internal: true
    driver: bridge
  hares_egress:
    driver: bridge

volumes:
  hares_postgres_data:
  hares_redis_data:
