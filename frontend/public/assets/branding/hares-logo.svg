<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="falconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.0" />
    </linearGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Cyber Shield Perimeter -->
  <polygon points="100,10 180,45 180,125 100,190 20,125 20,45" 
           fill="url(#shieldGrad)" stroke="#10B981" stroke-width="3" stroke-linejoin="round" filter="url(#shadowGlow)"/>

  <!-- Inner Shield Facet -->
  <polygon points="100,24 165,54 165,118 100,172 35,118 35,54" 
           fill="#0B132B" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="6 3"/>

  <!-- Inner Ambient Glow -->
  <polygon points="100,28 160,56 160,115 100,166 40,115 40,56" 
           fill="url(#innerGlow)"/>

  <!-- Sovereign Falcon Sentinel Motif (Stylized Wings & Beak) -->
  <!-- Left Wing -->
  <path d="M100 50 L55 75 L70 95 L100 78 Z" fill="url(#falconGold)"/>
  <path d="M100 80 L60 102 L72 118 L100 98 Z" fill="#F59E0B"/>
  
  <!-- Right Wing -->
  <path d="M100 50 L145 75 L130 95 L100 78 Z" fill="url(#falconGold)"/>
  <path d="M100 80 L140 102 L128 118 L100 98 Z" fill="#F59E0B"/>

  <!-- Falcon Crest Head & Sentry Eye -->
  <path d="M100 38 L112 55 L100 72 L88 55 Z" fill="#FBBF24"/>
  <!-- Beak -->
  <polygon points="100,64 104,78 100,84 96,78" fill="#D97706"/>

  <!-- Cyber Node Sentry Core (Glowing Cyan Diamond) -->
  <polygon points="100,108 112,120 100,132 88,120" fill="#06B6D4" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="100" cy="120" r="3" fill="#FFFFFF"/>

  <!-- Digital Radar Trace Rings -->
  <circle cx="100" cy="120" r="22" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  
  <!-- Lower Shield Sentry Blade -->
  <polygon points="100,136 106,158 100,164 94,158" fill="#10B981"/>
</svg>
