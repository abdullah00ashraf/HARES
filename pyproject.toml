[project]
name = "hares"
version = "0.1.0"
description = "Project Hares: Dubai Automated Fraud Triage and Threat Intelligence System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "gradio-client>=1.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "celery[redis]>=5.4.0",
    "redis>=5.1.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "httpx>=0.27.2",
    "tldextract>=5.1.2",
    "idna>=3.10",
    "Levenshtein>=0.26.0",
    "starlette>=0.40.0,<0.48.0",
    "python-dotenv>=1.0.1",
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "faster-whisper>=1.0.0",
    "ctranslate2>=4.4.0",
    "outlines>=0.0.44",
    "ffmpeg-python>=0.2.0",
    "cryptography>=43.0.0",
    "prometheus-client>=0.20.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "aiosqlite>=0.20.0",
    "locust>=2.30.0",
]

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
